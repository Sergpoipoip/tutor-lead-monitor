# Reference only; the application reads sources.yml.
sources:
  - key: telegram_authorized_channel_example
    kind: telegram_bot_updates
    display_name: Authorized Telegram channel
    owner: Replace with the channel owner
    enabled: false
    policy_status: pending
    access_method: authorized_bot
    collector_interval_seconds: 300
    credential_env: TELEGRAM_BOT_TOKEN
    operations:
      freshness_sla_seconds: 900
      pause_after_consecutive_failures: 5
      quota_policy: provider-specific
      authorization_expires_at: null
    config:
      allowed_chat_ids: []
    policy:
      authorization_basis: Requires explicit owner permission and bot membership
      terms_review: Pending review before implementation and enablement
      rate_limit: Pending current official API review
      retained_fields: [external_id, url, text, published_at, collected_at]
      reviewed_at: null
      reviewer: null
      notes: Unsupported in Milestone 1; do not enable
    retention_days: 90
  - key: yandex_web_search
    kind: web_search
    display_name: Яндекс — фрагменты поисковой выдачи
    owner: Project owner
    enabled: false
    policy_status: pending
    access_method: official_api
    credential_env: YANDEX_SEARCH_API_KEY
    collector_interval_seconds: 3600
    operations:
      freshness_sla_seconds: 7200
      pause_after_consecutive_failures: 5
      quota_policy: Manual only; at most 3 requests per run by default; no automatic retries
      authorization_expires_at: null
    config:
      provider: yandex
      query_ids: [seek_tutor, need_tutor, recommend_tutor]
      max_requests_per_run: 3
      results_per_query: 10
    policy:
      authorization_basis: Pending owner review of API access and search-result retention
      terms_review: Owner must review current provider terms before enablement; see docs/SOURCES.md
      rate_limit: Sequential requests; bounded run; honor bounded Retry-After through stored pause
      retained_fields: [external_id, url, text, published_at, collected_at, query_group, rank, domain, provider, evidence_kind]
      reviewed_at: null
      reviewer: null
      notes: Title/passages only; no destination crawling, smart snippets, scheduling, or service-improvement logging
    retention_days: 90
