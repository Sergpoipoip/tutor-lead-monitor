  - key: vk_repetera
    kind: vk_api
    display_name: Репетитор / Ищу Репетитора / Поиск репетитора
    owner: Project owner
    enabled: false
    policy_status: pending
    access_method: official_api
    credential_env: VK_ACCESS_TOKEN
    collector_interval_seconds: 3600
    operations:
      freshness_sla_seconds: 7200
      pause_after_consecutive_failures: 5
      quota_policy: >-
        One wall.get request per ordinary run of one source; seven hourly sources
        would produce approximately 5,040 calls in 30 days if scheduled later. Owner-reviewed unverified-profile
        limit on 2026-09-19 was 10,000 calls per month. No automatic retries.
      authorization_expires_at: null
    config:
      community_id: 44923684
      screen_name: repetera
      api_version: "5.199"
      initial_posts: 20
      incremental_posts: 100
    policy:
      authorization_basis: >-
        Official API access audited by the owner on 2026-09-19. Written clarification
        from VK Support permitting the described classification, scoring, minimal
        storage and private Telegram delivery is retained privately by the project owner.
        Runtime enablement awaits explicit owner approval.
      terms_review: Owner reviewed Platform Rules revision 2026-08-19; recheck before enablement
      rate_limit: One sequential wall.get request per source run; no automatic retries or scheduling
      retained_fields: [external_id, url, text, published_at, collected_at, community_id, post_id, screen_name, is_pinned, post_type, original_posts, evidence_kind]
      reviewer: null
      reviewed_at: null
      notes: Public wall text and minimal repost provenance only; no profiles, comments, attachments or destination crawling
    retention_days: 90
